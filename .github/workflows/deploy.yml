# ─────────────────────────────────────────────────────────
# CAFT Financial Server — CI/CD Pipeline
# Triggers on push/merge to main branch
#
# Architecture:
#   1. Build Docker image and push to ECR
#   2. SSH into EC2 and pull the new image
#   3. Run database migrations in an ephemeral container
#      - If migration fails → pipeline aborts, old container stays live
#   4. Run database seed (idempotent — safe on every deploy)
#   5. Restart backend with the new image
#   6. Health-check the new container before declaring success
#      - If health check fails → auto-rollback to previous image
# ─────────────────────────────────────────────────────────

name: Deploy Backend

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 358464500004.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPOSITORY: caft-server
  EC2_USER: ubuntu

jobs:
  deploy:
    name: Build & Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build \
            --build-arg BUILD_SHA=$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -euo pipefail

            echo "════════════════════════════════════════════"
            echo "  CAFT Financial — Production Deployment"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "════════════════════════════════════════════"

            cd /opt/caft

            # ── Step 1: Authenticate with ECR ──────────────
            echo ""
            echo "▶ Step 1/6: ECR Authentication"
            aws ecr get-login-password --region ap-south-1 \
              | docker login --username AWS --password-stdin 358464500004.dkr.ecr.ap-south-1.amazonaws.com
            echo "  ✅ ECR authenticated"

            # ── Step 2: Pull latest image ──────────────────
            echo ""
            echo "▶ Step 2/6: Pulling latest image"
            docker pull 358464500004.dkr.ecr.ap-south-1.amazonaws.com/caft-server:latest
            echo "  ✅ Image pulled"

            # ── Step 3: Run migrations in ephemeral container
            # This runs BEFORE the live container is touched.
            # If migrations fail, set -e aborts the script and
            # the existing live container stays untouched.
            echo ""
            echo "▶ Step 3/6: Running database migrations"
            docker compose -f docker-compose.prod.yml run \
              --rm \
              --no-deps \
              backend \
              npx prisma migrate deploy
            echo "  ✅ Migrations applied successfully"

            # ── Step 4: Run seed (idempotent — uses upsert) ──
            # Ensures admin user and default settings always exist.
            # Safe to run on every deploy; upsert skips existing records.
            echo ""
            echo "▶ Step 4/6: Running database seed"
            docker compose -f docker-compose.prod.yml run \
              --rm \
              --no-deps \
              backend \
              node dist/prisma/seed.js
            echo "  ✅ Seed completed"

            # ── Step 5: Capture current image for rollback ──
            echo ""
            echo "▶ Step 5/6: Deploying new container"
            PREV_IMAGE=$(docker inspect --format='{{.Config.Image}}' caft-backend 2>/dev/null || echo "none")
            echo "  Previous image: $PREV_IMAGE"

            # Recreate backend with the new image
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate backend
            echo "  Container started, waiting for health check..."

            # ── Step 6: Health check with rollback ──────────
            echo ""
            echo "▶ Step 6/6: Health check"
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(curl -sf http://localhost:5000/api/health 2>/dev/null | grep -o '"success":true' || true)
              if [ -n "$STATUS" ]; then
                HEALTHY=true
                echo "  ✅ Health check passed (attempt $i/12)"
                break
              fi
              echo "  ⏳ Waiting... (attempt $i/12)"
            done

            if [ "$HEALTHY" = false ]; then
              echo ""
              echo "  ❌ HEALTH CHECK FAILED — initiating rollback"
              echo "  Last 20 container logs:"
              docker logs caft-backend --tail 20 2>&1 || true
              echo ""

              if [ "$PREV_IMAGE" != "none" ]; then
                echo "  Rolling back to: $PREV_IMAGE"
                docker stop caft-backend || true
                docker rm caft-backend || true
                docker compose -f docker-compose.prod.yml up -d --no-deps backend
                echo "  ⚠️  Rollback complete — old container restored"
              fi
              exit 1
            fi

            # ── Cleanup ────────────────────────────────────
            docker image prune -af --filter "until=24h" 2>/dev/null || true

            echo ""
            echo "════════════════════════════════════════════"
            echo "  ✅ Deployment completed successfully"
            echo "  $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "════════════════════════════════════════════"
